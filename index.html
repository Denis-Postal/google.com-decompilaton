<!DOCTYPE html>
<html itemscope="" itemtype="http://schema.org/WebPage" lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="origin" name="referrer">
  <meta content="/images/branding/googleg/1x/googleg_standard_color_128dp.png" itemprop="image">
  <title>Google</title>

  <style>
    /* Подключение шрифтов */
    @font-face {
      font-family: 'Google Sans';
      font-style: normal;
      font-weight: 400;
      font-display: optional;
      src: url(https://fonts.gstatic.com/s/googlesans/v58/4UaGrENHsxJlGDuGo1OIlL3Owp4.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Google Sans';
      font-style: normal;
      font-weight: 500;
      font-display: optional;
      src: url(https://fonts.gstatic.com/s/googlesans/v58/4UawrENHsxJlGDuGo1OIlL32Jh8dS0J9.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    /* Базовые стили */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #202124;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    a {
      color: #1a0dab;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Шапка (Header) */
    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 16px 24px;
      gap: 15px;
    }

    .nav-link {
      color: rgba(0,0,0,0.87);
      font-size: 13px;
      line-height: 24px;
    }

    .nav-link:hover {
      opacity: 0.85;
      text-decoration: underline;
    }

    .apps-icon {
      width: 24px;
      height: 24px;
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      fill: #5f6368;
    }

    .apps-icon:hover {
      background-color: rgba(60,64,67,0.08);
    }

    .btn-signin {
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      padding: 9px 23px;
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.25px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s, box-shadow 0.2s;
    }

    .btn-signin:hover {
      background-color: #1b66c9;
      box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
      text-decoration: none;
    }

    /* Главный блок поиска */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: -50px;
    }

    .logo-container {
      margin-bottom: 20px;
    }

    .google-logo {
      width: 272px;
      height: 92px;
    }

    .search-box {
      width: 100%;
      max-width: 584px;
      margin: 0 auto;
      padding: 0 12px;
    }

    .search-input-wrapper {
      display: flex;
      align-items: center;
      height: 46px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      padding: 0 14px;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .search-input-wrapper:hover, .search-input-wrapper:focus-within {
      background-color: #fff;
      box-shadow: 0 1px 6px rgba(32,33,36,0.28);
      border-color: rgba(223,225,229,0);
    }

    .search-icon {
      width: 20px;
      height: 20px;
      fill: #9aa0a6;
      margin-right: 12px;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      color: #202124;
      background: transparent;
    }

    .voice-search, .image-search {
      width: 24px;
      height: 24px;
      cursor: pointer;
      margin-left: 10px;
    }

    .buttons-container {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn-search {
      background-color: #f8f9fa;
      border: 1px solid #f8f9fa;
      border-radius: 4px;
      color: #3c4043;
      font-family: Roboto, Arial, sans-serif;
      font-size: 14px;
      margin: 11px 4px;
      padding: 0 16px;
      line-height: 36px;
      height: 36px;
      min-width: 54px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .btn-search:hover {
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
      background-color: #f8f9fa;
      border: 1px solid #dadce0;
      color: #202124;
    }

    /* Подвал (Footer) */
    footer {
      background-color: #f2f2f2;
      color: #70757a;
    }

    .footer-location {
      padding: 15px 30px;
      border-bottom: 1px solid #dadce0;
      font-size: 15px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      padding: 0 20px;
    }

    .footer-section {
      display: flex;
      flex-wrap: wrap;
    }

    .footer-section a {
      color: #70757a;
      padding: 15px;
      font-size: 14px;
      display: block;
    }

    .footer-section a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .footer-links {
        justify-content: center;
      }
      .footer-section {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- Шапка страницы -->
  <header>
    <a class="nav-link" href="https://mail.google.com/">Gmail</a>
    <a class="nav-link" href="https://www.google.com/imghp">Картинки</a>
    
    <!-- Иконка меню приложений -->
    <svg class="apps-icon" focusable="false" viewBox="0 0 24 24">
      <path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"></path>
    </svg>

    <!-- Кнопка входа -->
    <a class="btn-signin" href="https://accounts.google.com/">Войти</a>
  </header>

  <!-- Главная поисковая область -->
  <main>
    <div class="logo-container">
      <img class="google-logo" src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google">
    </div>

    <form action="https://www.google.com/search" method="GET" class="search-box">
      <div class="search-input-wrapper">
        <svg class="search-icon" focusable="false" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
        </svg>
        <input type="text" name="q" class="search-input" title="Поиск" id="search-input" autocomplete="off" autofocus>
        
        <!-- Иконка голосового поиска -->
        <svg class="voice-search" focusable="false" viewBox="0 0 24 24">
          <path fill="#4285f4" d="m12 15c1.66 0 3-1.31 3-2.97v-7.02c0-1.66-1.34-3.01-3-3.01s-3 1.34-3 3.01v7.02c0 1.66 1.34 2.97 3 2.97z"></path>
          <path fill="#34a853" d="m11 18.08h2v3.92h-2z"></path>
          <path fill="#fbbc05" d="m7.05 16.87c-1.27-1.27-2.05-3.01-2.05-4.97h2c0 1.41.56 2.68 1.46 3.61z"></path>
          <path fill="#ea4335" d="m12 17c-2.76 0-5-2.24-5-5h-2c0 3.53 2.61 6.43 6 6.92v2.08h2v-2.08c3.39-.49 6-3.39 6-6.92h-2c0 2.76-2.24 5-5 5z"></path>
        </svg>

        <!-- Иконка поиска по картинке -->
        <svg class="image-search" focusable="false" viewBox="0 0 192 192">
          <path fill="#4285F4" d="M155 32H37c-2.8 0-5 2.2-5 5v118c0 2.8 2.2 5 5 5h118c2.8 0 5-2.2 5-5V37c0-2.8-2.2-5-5-5z" opacity=".1"></path>
          <path fill="#4285F4" d="M123 105.5c0 7.5-6 13.5-13.5 13.5S96 113 96 105.5s6-13.5 13.5-13.5 13.5 6 13.5 13.5z"></path>
          <path fill="#34A853" d="M52 143l28-35 20 25 15-18 25 28H52z"></path>
        </svg>
      </div>

      <div class="buttons-container">
        <input type="submit" value="Поиск в Google" class="btn-search">
        <input type="submit" name="btnI" value="Мне повезёт!" class="btn-search">
      </div>
    </form>
  </main>

  <!-- Подвал страницы -->
  <footer>
    <div class="footer-location">Украина</div>
    <div class="footer-links">
      <div class="footer-section">
        <a href="https://about.google/">Всё о Google</a>
        <a href="https://ads.google.com/">Реклама</a>
        <a href="https://www.google.com/services/">Для бизнеса</a>
        <a href="https://google.com/search/howsearchworks/">Как работает Поиск</a>
      </div>
      <div class="footer-section">
        <a href="https://policies.google.com/privacy">Конфиденциальность</a>
        <a href="https://policies.google.com/terms">Условия</a>
        <a href="#">Настройки</a>
      </div>
    </div>
  </footer>

  <!-- Инициализация метаданных среды Google -->
  <script>
    (function() {
      // Инициализация глобального объекта Google
      window.google = {
        kEI: 'SN-BaubCM-rci-gP4fXwoAI',
        kEXPI: '31',
        kBL: 'NA_J',
        kOPI: 89978449,
        sn: 'webhp',
        kHL: 'ru',
        usb: true
      };

      window._hst = Date.now();

      // Асинхронная загрузка шрифтов
      if (document.fonts && document.fonts.load) {
        document.fonts.load("400 10pt 'Google Sans'");
        document.fonts.load("500 10pt 'Google Sans'");
      }

      // Перехват отправки формы
      var searchForm = document.querySelector('form');
      searchForm.addEventListener('submit', function(e) {
        var input = document.getElementById('search-input');
        if (!input.value.trim()) {
          e.preventDefault();
        }
      });
    })();
  </script>
</body>
</html>
